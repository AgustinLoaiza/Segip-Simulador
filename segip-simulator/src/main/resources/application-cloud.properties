
# ==========================================
# SEGIP SIMULATOR - ENTORNO CLOUD
# ==========================================

spring.application.name=segip-simulator

# Puerto para Render
server.port=${PORT:8081}

# ==========================================
# POSTGRESQL - NEON
# ==========================================

spring.datasource.url=jdbc:postgresql://${NEON_DB_HOST}:5432/${NEON_DB_NAME:neondb}?sslmode=require

spring.datasource.username=${NEON_DB_USER}
spring.datasource.password=${NEON_DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ==========================================
# FLYWAY
# ==========================================

spring.flyway.enabled=true

# ==========================================
# ACTUATOR
# ==========================================

management.endpoints.web.exposure.include=health,info
